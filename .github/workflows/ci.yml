name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core Server (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    # Both ends of what the gemspec allows. `docs/KNOWN_LIMITATIONS.md`
    # says a version is supported once this suite exercises it, and until
    # now the suite ran on 3.3 alone -- the one version that document
    # called unsupported, while the two it called supported ran nowhere in
    # CI. Either the claim or the matrix had to move; this is the half
    # that makes the claim true rather than reworded.
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: core

      # Both real-Rails-backed suites -- spec/integration/real_rails_spec.rb
      # and spec/e2e/capabilities_spec.rb, which share the
      # spec/fixtures/rails_real bundle -- are *designed* to skip
      # themselves, not fail, when `rails`/`sqlite3`
      # aren't resolvable as local gems -- that's deliberate for local
      # development on a machine without them. In CI it must never
      # silently skip: a skip here means the suite that catches bugs Fake
      # Rails structurally can't (docs/design/tasks/008.5-runtime-and-index-corrections.md,
      # docs/design/tasks/008.6-agent-and-index-hardening.md) simply
      # didn't run, and nothing else would notice
      # (docs/design/tasks/008.6-agent-and-index-hardening.md item 10).
      # Installing real rails/sqlite3 gems here up front is what makes
      # `bundle install --local` inside spec/fixtures/rails_real succeed
      # instead of skipping.
      - name: Install real Rails/sqlite3 (required by the real-Rails and capability suites)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
          gem install rails -v '~> 8.1' --no-document
          gem install sqlite3 -v '>= 2.1' --no-document

      # `core/spec/meta/client_behaviour_spec.rb` reads
      # `vscode-languageclient`'s own source to check the facts
      # `docs/CLIENT_BEHAVIOUR.md` marks **checked**, and skipped itself
      # when the module was absent -- which was every CI run for a
      # release, because this job never installed it. Production
      # dependencies only: the client is one, and the dev tree is the
      # vscode job's business.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the extension's production dependencies (read by the client-behaviour checks)
        working-directory: vscode
        run: npm ci --omit=dev

      - name: Ruby syntax check
        working-directory: core
        run: find lib spec -name '*.rb' -print0 | xargs -0 -n1 ruby -c

      - name: Run full test suite
        working-directory: core
        run: bundle exec rspec --format documentation --format json --out tmp/rspec.json

      # The documented-count checks skip when the run is not the whole
      # suite, which is correct for a subset run and wrong here: this is
      # the run those figures are measured from. Two review rounds put a
      # vacuous predicate in that file trying to state the same thing from
      # inside the suite; it cannot be stated there, because a subset run
      # is legitimate. Here it can: this step runs after the whole suite
      # by construction, so a pending from that file means the number
      # nobody re-measures went unchecked again.
      - name: Fail if a documented-count check skipped
        working-directory: core
        run: |
          ruby -rjson -e '
            result = JSON.parse(File.read("tmp/rspec.json", encoding: "UTF-8"))
            skipped = result.fetch("examples").select do |ex|
              ex.fetch("file_path").include?("spec/meta/documented_counts_spec.rb") &&
                ex.fetch("status") == "pending"
            end
            unless skipped.empty?
              warn "the documented example-count checks skipped on a full run:"
              skipped.each { |ex| warn "  #{ex.fetch("full_description")} -- #{ex["pending_message"]}" }
              exit 1
            end
          '

      # `bundle exec rspec` exits 0 as long as nothing *failed* -- a
      # skipped example (RSpec's `pending`) doesn't fail the run on its
      # own, which is exactly how both real-Rails-backed suites behave
      # when they can't find rails/sqlite3 locally. This step turns that
      # into a hard CI failure, so a broken/missing real-Rails setup can
      # never masquerade as "tests passed".
      #
      # Both suites, not just the integration one. `capabilities_spec.rb`
      # uses the identical skip-when-unavailable mechanism, and
      # `capability_coverage_spec.rb` cannot catch it -- that guard scans
      # the spec file's *source text* for `it "C5: ..."`, so it cannot
      # tell a row that ran from a row that was skipped. Measured: with
      # the fixture unavailable, the e2e suite gives "45 examples, 0
      # failures, 41 pending" and exit status 0, which is exactly what
      # EXTENSION_CAPABILITIES.md's "a capability whose row is skipped is
      # not shipped" exists to prevent (024.16).
      - name: Fail if the real-Rails or capability suites were skipped instead of run
        working-directory: core
        run: |
          ruby -rjson -e '
            result = JSON.parse(File.read("tmp/rspec.json", encoding: "UTF-8"))
            {
              "real-Rails integration" => "spec/integration/real_rails_spec.rb",
              "capability E2E" => "spec/e2e/capabilities_spec.rb",
              # Same failure mode, found a release later: these read the
              # client'"'"'s own source and skipped when node_modules was
              # absent, which was every run here. The comment in that file
              # claimed the example count would notice; it counts skipped
              # examples, so nothing did.
              "client-behaviour" => "spec/meta/client_behaviour_spec.rb"
            }.each do |label, path|
              examples = result.fetch("examples").select { |ex| ex.fetch("file_path").include?(path) }
              if examples.empty?
                warn "#{path} contributed zero examples -- was it even loaded?"
                exit 1
              end
              # Not every pending example. docs/EXTENSION_CAPABILITIES.md
              # defines a `NOT YET` row as one that is "specified, has an
              # E2E row, currently failing or pending" -- a state the
              # document tells authors to use, and that
              # capability_coverage_spec.rb accepts. Failing on those
              # would make the documented state unexpressible. What this
              # guard is actually about is the environment skip, so a
              # pending example has to say `NOT YET` to be allowed
              # through, and anything else -- including the
              # rails/sqlite3 skip, whose message does not -- is a
              # failure.
              skipped = examples.reject { |ex| ex.fetch("status") != "pending" || ex.fetch("pending_message").to_s.include?("NOT YET") }
              unless skipped.empty?
                warn "#{skipped.size}/#{examples.size} #{label} examples were skipped in CI. Either rails/sqlite3 are missing (they must be installed here, not optional), or a deliberately pending row does not say NOT YET in its message, which docs/EXTENSION_CAPABILITIES.md requires:"
                skipped.each { |ex| warn "  - #{ex.fetch("full_description")} (#{ex.fetch("pending_message")})" }
                exit 1
              end
              puts "All #{examples.size} #{label} examples ran (none skipped for want of an environment)."
            end
          '

  core-ruby-4:
    name: Core Server (Ruby 4.0, informational)
    runs-on: ubuntu-latest
    # Reports; never gates. `docs/SUPPORT_MATRIX.md` calls 4.0 "best
    # effort", and the standing decision for the 0.2.x line is that a
    # 4.0-specific failure gets recorded rather than fixed -- a required
    # job would turn the first one into work nobody agreed to do. What
    # this buys is that the 4.0 row stops being a claim measured once by
    # hand on one machine: that row used to end "nothing continuously
    # verifies 4.0", and it was right.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: core

      - name: Ruby syntax check
        working-directory: core
        run: find lib spec -name '*.rb' -print0 | xargs -0 -n1 ruby -c

      # No real Rails installed here, deliberately. The real-Rails and
      # capability suites skip themselves when rails/sqlite3 cannot be
      # resolved, and installing them under 4.0 would make this job's
      # failures a report on Rails' own 4.0 readiness rather than on
      # OvalLSP's. The `core` job above is the one where such a skip is a
      # hard failure; this job is about the engine's own suite.
      - name: Run the suite that does not need a real Rails
        working-directory: core
        run: bundle exec rspec --format progress --format json --out tmp/rspec-4.json

      # Non-gating is a decision about *failures*; it was never a decision
      # to accept "nothing ran" as a pass. `continue-on-error` makes this
      # job green whatever happens, so without a count nobody can tell a
      # 4.0 run that passed from a 4.0 that never started -- which is
      # exactly `CLAUDE.md`'s "a green suite is a measurement too" arriving
      # in the one job whose whole purpose is to answer "is 4.0 green".
      # The documents that cite this job as continuous verification are
      # citing this count.
      #
      # `if: !cancelled()` because the default `success()` would skip
      # this step exactly when the count matters most -- a red 4.0
      # suite, or RSpec dying before it wrote the JSON -- and then
      # "failed" and "never started" stop being distinguishable. Found
      # by the external review of the 0.2.3 release PR. Not `always()`:
      # a cancelled workflow should not fabricate a report.
      - name: Report the 4.0 example count, and fail this job if nothing ran
        if: ${{ !cancelled() }}
        working-directory: core
        run: |
          ruby -rjson -e '
            path = "tmp/rspec-4.json"
            unless File.exist?(path)
              warn "the 4.0 suite wrote no JSON -- it did not run, or died before reporting"
              exit 1
            end
            begin
              result = JSON.parse(File.read(path, encoding: "UTF-8"))
            rescue JSON::ParserError => e
              warn "the 4.0 suite left unreadable JSON (#{e.message}) -- treating as not run"
              exit 1
            end
            summary = result.fetch("summary")
            count = summary.fetch("example_count")
            line = "Ruby 4.0: #{count} examples, #{summary.fetch("failure_count")} failures"
            File.write(ENV.fetch("GITHUB_STEP_SUMMARY", "/dev/null"), "#{line}\n", mode: "a")
            warn line
            if count.zero?
              warn "the 4.0 suite contributed zero examples -- it did not run"
              exit 1
            end
          '

  vscode:
    name: VS Code extension (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install dependencies
        working-directory: vscode
        run: npm ci

      - name: Type check
        working-directory: vscode
        run: npm run compile

      - name: Unit tests
        working-directory: vscode
        run: npm run test:unit

  # **The only tests that launch a real VS Code and drive the extension
  # against a real Core**, and until 0.2.12 they ran nowhere between
  # releases -- only when a maintainer ran the pre-publish bundle on an
  # Apple Silicon Mac (`024.69`). That is how the harness came to be
  # broken for every VS Code release since 1.110 while the tree recorded
  # the gate items about it as green: the only thing that could have
  # contradicted that was the gate itself, run twice a month.
  #
  # `xvfb-run` because VS Code needs a display and this runner has none.
  # Ruby and the bundle are installed because the extension spawns the
  # real Core Server, which is the half a unit test cannot reach.
  vscode-integration:
    name: VS Code extension (integration, real editor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: core

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install dependencies
        working-directory: vscode
        run: npm ci

      - name: Integration tests (monorepo-relative Core)
        working-directory: vscode
        run: xvfb-run -a npm run test:integration 2>&1 | tee integration.log

      # **A green run is a measurement, and it can be green because it did
      # not run.** `runTest.js` exits 0 when the extension host reports no
      # failures, and no failures is also what zero examples looks like --
      # so a harness that stops discovering tests, or an activation that
      # quietly never happens, would read as a pass. That is the same
      # hazard the core job guards with "Fail if the real-Rails or
      # capability suites were skipped instead of run", and this job would
      # otherwise replace "nobody runs them" with "CI runs them and would
      # not notice if it stopped".
      - name: Fail if the integration suite reported no examples
        working-directory: vscode
        run: |
          count=$(grep -oE '[0-9]+ passing' integration.log | tail -1 | grep -oE '[0-9]+' || echo 0)
          echo "integration examples: $count"
          if [ "${count:-0}" -lt 1 ]; then
            echo "The integration suite reported no passing examples. A real VS Code launching and"
            echo "discovering nothing exits 0, which is why this check exists (024.69)." >&2
            exit 1
          fi

  # The site check compares the version the index pages advertise
  # against vscode/package.json, and it must run when *either* side of
  # that comparison moves. Until 0.2.3 the deploy workflow that also
  # runs it triggered only on site/ changes, so a version bump alone
  # could turn the check red with nothing to fire it -- which is what
  # 0.2.2 did. The deploy now watches the version file too; this job is
  # path-unfiltered, so it also catches drift introduced from outside
  # that watch list (a roadmap or changelog edit, say -- both inputs of
  # the check's parity half). Here it runs on every pull request and
  # every push to main. History and the measured timeline:
  # docs/design/tasks/028-0.2.3-review-loop.md.
  site-consistency:
    name: Site consistency (check_site_links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Site matrix, links and version badge against the tree
        run: ruby scripts/check_site_links.rb

  # Task 023.7: full git history secret scan, on every PR/push -- not
  # merely a one-time pre-release check. `fetch-depth: 0` is required so
  # gitleaks actually walks the repo's full history rather than the
  # single shallow commit `actions/checkout` fetches by default.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action's own PR mode calls the GitHub API to list the PR's
    # commits (to scan just the diff) -- found by actually running this
    # workflow for the first time (this session's own first push): without
    # `pull-requests: read` explicitly granted here, the default
    # `GITHUB_TOKEN` this repository issues doesn't include it, and the
    # action fails outright with a 403 ("Resource not accessible by
    # integration") before it ever gets to scan anything. Not a secret
    # finding -- a permissions gap in the workflow itself.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      # 0.2.3: a commit *message* is a disclosure path a tree scan cannot
      # see, and gitleaks scans blobs rather than messages -- 0.2.3 put a
      # home directory path in both halves and only the tree half would
      # have been caught. This job is where it belongs because it already
      # fetches full history above; the script refuses a shallow clone
      # outright rather than scanning one commit and reporting the
      # history clean. `core/spec/meta/home_path_guard_spec.rb` reads the
      # same scanner for tracked content, so the two cannot diverge, and
      # `ci_skip_guard_spec.rb` pins that this step still exists.
      - name: No real home directory path in any commit message
        run: ruby scripts/check_home_paths.rb --messages

  # Task 023.7: verifies a freshly-packaged VSIX never contains this
  # build machine's own absolute paths -- a regression guard for the
  # native-extension-build-log leak found and fixed in Task 023.6
  # (mkmf.log/gem_make.out/Makefile embedding the packaging machine's
  # username/home directory verbatim). Runs on ubuntu-latest (not
  # darwin-arm64) deliberately: this check is about package *contents*
  # hygiene, not about producing a release-quality Apple Silicon binary --
  # see the separate apple-silicon-release workflow for the real,
  # native-arm64 build.
  package-contents-inspection:
    name: Package contents inspection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: core

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install npm dependencies
        working-directory: vscode
        run: npm ci

      - name: Package the extension
        working-directory: vscode
        run: npm run package

      - name: List package contents
        working-directory: vscode
        run: npx @vscode/vsce ls --tree > /tmp/vsix-contents.txt

      # Catches "what copy-core.js hashed" drifting from "what actually
      # ships" -- the defect that made every v0.1.2/v0.1.3 install report
      # a false "Payload hash mismatch ... may be corrupted" at
      # activation. Runs here, on every PR, because that divergence is
      # entirely platform-independent (it is just file hashing) even
      # though the VSIX built on this Linux runner is not a releasable
      # Apple Silicon artifact.
      - name: Verify the packaged VSIX matches its own recorded payload hash
        working-directory: vscode
        run: |
          VSIX=$(ls ovallsp-*.vsix)
          rm -rf /tmp/vsix-payload-check
          mkdir -p /tmp/vsix-payload-check
          unzip -q "$VSIX" -d /tmp/vsix-payload-check
          node scripts/verify-packaged-payload-hash.js /tmp/vsix-payload-check/extension

      - name: Fail on any absolute path from this build machine, or any other unexpected leak
        working-directory: vscode
        run: |
          VSIX=$(ls ovallsp-*.vsix)
          mkdir -p /tmp/vsix-unpacked
          unzip -q "$VSIX" -d /tmp/vsix-unpacked

          # Deliberately checks for *this runner's own* $HOME value only
          # -- not a broad `/Users/[a-zA-Z0-9_-]+`/`/home/[a-zA-Z0-9_-]+`
          # pattern. A broad pattern false-positives on legitimate
          # third-party content this project doesn't control: the `rbs`
          # gem's own bundled stdlib documentation contains an *example*
          # path (`/Users/rhc`) in a code-sample comment, unrelated to any
          # real build-machine leak. Matching this run's actual `$HOME`
          # verbatim is what actually distinguishes "this build's own
          # absolute path leaked" from "an unrelated string happens to
          # look like a home directory". `grep -r` against the real,
          # unpacked VSIX contents -- not just the file list -- so this
          # catches leaks inside file *content*, not only in filenames.
          if grep -rlF "$HOME" /tmp/vsix-unpacked/ ; then
            echo "FAILED: packaged VSIX contains this build machine's own absolute path -- see files listed above"
            exit 1
          fi
          echo "OK: no local absolute paths found in packaged VSIX contents"
