# Mutations an example claims to catch, and the example that must catch it.
#
# `042`'s D7. An example whose fixture cannot distinguish the two candidate
# behaviours passes under both, and no amount of reading finds that: 0.2.11's
# third round found one in the spec written to close `024.110`, whose own
# comment promised it would fail under the change it guarded against, and
# which passed under it. `024.109` is three more, lost before they were
# written down.
#
# This is the hunk sweep turned around. The sweep asks "does *anything* fail
# when this line is reverted"; this asks "does *this example* fail when the
# decision it names is inverted". A comment claiming an example distinguishes
# something is a claim about this tree, and `CLAUDE.md` says a claim about
# this tree is derived rather than typed.
#
# Each entry names:
#   why      -- the decision, in one line, as the example's own comment puts it
#   file     -- a path under `core/lib`, relative to the repository root
#   from/to  -- an exact replacement. `from` must appear exactly once
#   spec     -- the spec file, relative to `core/`
#   example  -- the full example description; `rspec -e` must select exactly one
#
# `from` and `to` are JSON strings (JSON is valid YAML) so that leading
# whitespace survives exactly. A block scalar cannot: its indentation is set by
# its first line, and a later line indented *less* silently ends the block --
# which is how the first version of this file failed to parse.
#
# Run by `scripts/check_pinned_mutations.rb`, which applies each mutation to a
# throwaway copy of `core/lib` and runs the named example against it. The live
# tree is never modified: the copy goes first on the load path.

- why: "024.110's per-owner claim -- reading a synthesised link's open surface, which makes one `alias_method` in a core_ext file decline about every class in the workspace."
  file: core/lib/ovallsp/semantic/method_resolver.rb
  from: "        return false if synthesised_link?(entry)\n"
  to: ""
  spec: spec/ovallsp/diagnostics/unreadable_macro_spec.rb
  example: "declines about the owner whose own body was unreadable, and only that owner"

- why: "024.116's side remap -- asking a `:class_object` or `:extend` link about its singleton side, which misses a workspace `class Object; def method_missing`."
  file: core/lib/ovallsp/semantic/method_resolver.rb
  from: "kind: side_of(entry, singleton))"
  to: "kind: singleton ? :singleton_method : :instance_method)"
  spec: spec/ovallsp/diagnostics/unreadable_macro_spec.rb
  example: "says nothing about a class-level call when a workspace Object declares method_missing"

- why: "024.112's guard -- disabling the ancestor step inside `def self.x` as well as inside `class << self`, which inverts both directions there."
  file: core/lib/ovallsp/local_inferencer.rb
  from: "return nil if @in_singleton_class"
  to: "return nil if @self_type_stack.last.is_a?(Types::Generic)"
  spec: spec/ovallsp/diagnostics/nested_bare_name_spec.rb
  example: "looks through the superclass's namespace from inside def self.x"

- why: "024.115's marker -- matching the concern marker on the name as written rather than as resolved, which misses Rails' own bare `extend Concern`."
  file: core/lib/ovallsp/semantic/hierarchy_index.rb
  from: "Index::SymbolId.bare_name(canonical_name(target).to_s)"
  to: "Index::SymbolId.bare_name(target.to_s)"
  spec: spec/ovallsp/parser_concern_class_methods_spec.rb
  example: "recognises the marker written bare from inside ActiveSupport"

- why: "0.2.9's `unknown` refusing a nil reason -- the guarantee that a new way of not knowing cannot be recorded anonymously."
  file: core/lib/ovallsp/semantic/member_availability.rb
  from: "raise ArgumentError, \"an unknown availability must name its reason\" if reason.nil?"
  to: ""
  spec: spec/ovallsp/semantic/member_availability_spec.rb
  example: "refuses an unknown with no reason"

- why: "0.2.9's three-state answer -- that `unknown` cannot be read as an absence by a caller that only asks `absent?`."
  file: core/lib/ovallsp/semantic/member_availability.rb
  from: "def absent? = state == :absent"
  to: "def absent? = state != :present"
  spec: spec/ovallsp/semantic/member_availability_spec.rb
  example: "never lets an unknown be read as an absence"

- why: "0.2.9's deep freeze -- an answer a reader can be handed and then have changed under it."
  file: core/lib/ovallsp/semantic/member_availability.rb
  from: "candidates.freeze"
  to: "candidates"
  spec: spec/ovallsp/semantic/member_availability_spec.rb
  example: "is frozen all the way to the candidates a reader is handed"

- why: "0.2.9's visibility filter -- that a private or protected member is not offered on an explicit receiver."
  file: core/lib/ovallsp/semantic/method_resolver.rb
  from: "next if explicit_receiver && %i[private protected].include?(visibility)"
  to: "next if explicit_receiver && visibility == :private"
  spec: spec/ovallsp/diagnostics/visibility_spec.rb
  example: "a protected method is not offered on an explicit receiver from outside"

- why: "0.2.9's alias visibility -- that `private :aka` reaches an alias, which has no declaration for the rule to read."
  file: core/lib/ovallsp/semantic/method_resolver.rb
  from: "declared_visibility(owner, kind, name) || alias_visibility_of(owner, kind, name)"
  to: "declared_visibility(owner, kind, name)"
  spec: spec/ovallsp/diagnostics/visibility_spec.rb
  example: "is not offered when the alias itself is made private"

- why: "024.30's last unpinned decision, which 024.33's fix took over: an eval block on a receiver nothing can name must record no owner rather than invent one."
  file: core/lib/ovallsp/parser_service.rb
  from: "        raw_constant_name(receiver) ? receiver_owner_name(receiver) : :unnameable\n"
  to: "        receiver_owner_name(receiver)\n"
  spec: spec/ovallsp/diagnostics/eval_on_constant_spec.rb
  example: "records nothing for an eval block on an expression"

- why: "024.34's question -- asking the cref whether it declares a singleton, rather than asking what surface a definition written here lands on."
  file: core/lib/ovallsp/parser_service.rb
  from: "        owner_for_attrs, side = @cref.surface_for\n        return if owner_for_attrs.nil?\n\n        singleton = side == :singleton\n"
  to: "        singleton = @cref.declares_singleton?\n"
  spec: spec/ovallsp/diagnostics/attr_in_singleton_def_spec.rb
  example: "records no singleton accessor"

- why: "024.117's block rule -- isolating a block that iterates a literal, which Ruby says shares the enclosing body's self."
  file: core/lib/ovallsp/parser_service.rb
  from: "@cref.in_block(shares_self: iterates_a_literal?(node))"
  to: "@cref.in_block(shares_self: false)"
  spec: spec/ovallsp/diagnostics/unreadable_macro_spec.rb
  example: "opens the owner's surface for an unreadable macro called inside a block"

- why: "024.33's receiver -- an eval block on a constant carrying the enclosing owner instead of the constant self is set to."
  file: core/lib/ovallsp/parser_service.rb
  from: "          elsif (owner = eval_block_owner)\n            @cref.in_eval_block(owner == :unnameable ? nil : owner)\n          else\n"
  to: "          elsif false\n            nil\n          else\n"
  spec: spec/ovallsp/diagnostics/eval_on_constant_spec.rb
  example: "records an instance accessor on the constant for instance_eval"

- why: "024.31's owner -- a Struct.new / Class.new block attributing its declarations to the lexically enclosing class, which does not have them."
  file: core/lib/ovallsp/parser_service.rb
  from: "          if creates_a_class?\n            @cref.in_eval_block(nil)\n"
  to: "          if false\n            nil\n"
  spec: spec/ovallsp/diagnostics/class_creating_block_spec.rb
  example: "records nothing on the enclosing class for a Struct.new block"

# --- checks in `scripts/`, added in 0.2.14 ---------------------------
#
# `042`'s D7 asks "does *this example* fail when the decision it names is
# inverted". Until 0.2.14 it could only ask that of `core/lib`, so no
# decision inside a check could be pinned by it -- and round 2's attack
# method broke nearly every check in `scripts/` with the suite green.
#
# `scripts/` only, not the specs: the applier writes to the real file and
# restores it, which is safe for a script a spec shells out to and is not
# safe for a spec file, where the mutation could remove the example being
# run. A decision inside a spec is pinned by a second example instead.

- why: "check_doc_links' SKIP -- widening it to exclude core/ drops inspection from 537 files to 117 and a dangling citation in a core/lib source comment goes unreported, which is round 2's break verbatim."
  file: scripts/check_doc_links.rb
  from: "|core/spec/fixtures/rails_real/"
  to: "|core/|"
  spec: spec/meta/doc_links_spec.rb
  example: "reads every part of the tree it claims to, so narrowing its input is a failure"
- why: "check_doc_links' relative-link pass -- 107 links between task files resolve through it, and nothing else reads them."
  file: scripts/check_doc_links.rb
  from: "    line.scan(RELATIVE_LINK) do\n"
  to: "    [].each do\n"
  spec: spec/meta/doc_links_spec.rb
  example: "resolves a relative Markdown link against the citing file's own directory"
- why: "repo_files' --others -- without it every check is blind again to a file that has not been committed, which is 024.147."
  file: scripts/repo_files.rb
  from: "     git(root, %W[ls-files -z --others --exclude-standard] + pathspec)).uniq.sort"
  to: "     []).uniq.sort"
  spec: spec/meta/untracked_visibility_spec.rb
  example: "RepoFiles sees a file git does not track"
- why: "check_suites_ran's pending test -- a fully skipped suite reports examples and zero failures, so without this the check cannot fail in the case it exists for (024.148)."
  file: scripts/check_suites_ran.rb
  from: "        ex.fetch(\"status\") == \"pending\" && !ex.fetch(\"pending_message\").to_s.include?(ALLOWED_PENDING)"
  to: "        false"
  spec: spec/meta/suites_ran_spec.rb
  example: "fails when every example was skipped for want of an environment"
- why: "check_suites_ran's NOT YET exemption -- docs/EXTENSION_CAPABILITIES.md defines a state authors are told to use, and failing on it would make that state unexpressible."
  file: scripts/check_suites_ran.rb
  from: "  ALLOWED_PENDING = \"NOT YET\""
  to: "  ALLOWED_PENDING = \"\\u0000never-matches\""
  spec: spec/meta/suites_ran_spec.rb
  example: "allows a pending example that declares itself NOT YET"
- why: "documented_counts' nil-on-no-match -- without it a document whose wording moved out from under its pattern reports as rewritten, is counted as success, and the command exits 0."
  file: scripts/documented_counts.rb
  from: "    updated == text ? nil : updated\n"
  to: "    updated\n"
  spec: spec/meta/documented_counts_spec.rb
  example: "reports nothing written when a document's wording moved out from under its pattern"
- why: "generate_sbom's --check comparison -- without it the SBOM gate passes on any content at all."
  file: scripts/generate_sbom.rb
  from: "  if current == rendered"
  to: "  if true"
  spec: spec/meta/sbom_spec.rb
  example: "reports a divergence rather than passing on anything"
