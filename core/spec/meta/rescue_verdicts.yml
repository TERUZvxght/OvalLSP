# Every `rescue` statement in `core/lib`, and what it does with the failure.
#
# `042`'s D10 / `024.122`. The key is `<file>:<the rescue statement>`; the
# value is one of `surfaces`, `contained` or `swallows`, optionally followed
# by `: <why>` -- and for `contained`, the why is not optional in review.
#
#   surfaces  -- raises, or reports through a channel a person sees
#   contained -- the failure genuinely has no consequence, said in place
#   swallows  -- neither. This is the group `024.122` exists to empty
#
# `scripts/check_swallowed_failures.rb` fails on a rescue with no verdict,
# so adding one becomes an edit somebody makes on purpose. The verdicts
# below are a *first pass*: every site whose handler raises or reports was
# marked `surfaces` mechanically, and the rest are marked `swallows` --
# which is the safe default and the honest one, since nothing has yet been
# argued. Moving one to `contained` is the review work `024.122` describes.

